name: cd
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency: cd

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: demo
    env:
      API_URL: https://${{ vars.NAME }}-api.azurewebsites.net
      WEB_URL: https://${{ vars.NAME }}-web.azurewebsites.net
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Read secrets from Key Vault
        run: |
          for s in database-url api-key; do
            v=$(az keyvault secret show --vault-name "${{ vars.NAME }}-kv" -n "$s" --query value -o tsv)
            echo "::add-mask::$v"
            echo "$(echo "$s" | tr 'a-z-' 'A-Z_')=$v" >> "$GITHUB_ENV"
          done
      - name: Let this runner reach Postgres (removed at the end of the job)
        run: |
          ip=$(curl -fsS https://api.ipify.org)
          db=$(az resource show -g "${{ vars.AZURE_RG }}" -n "${{ vars.NAME }}-db" \
            --resource-type Microsoft.DBforPostgreSQL/flexibleServers --query id -o tsv)
          echo "FW_RULE=$db/firewallRules/gh-${{ github.run_id }}" >> "$GITHUB_ENV"
          az resource create --id "$db/firewallRules/gh-${{ github.run_id }}" --api-version 2024-08-01 -o none \
            --properties "{\"startIpAddress\":\"$ip\",\"endIpAddress\":\"$ip\"}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: npm run data
      - name: Fill computed tables
        run: npm run pipeline
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/api/package-lock.json
      - run: npm run setup
      - run: npm run migrate
      - run: npm run seed
      - name: Package the API (keeps backend/ paths for synthetic-data/reference and the recorded AI answers)
        run: |
          npm run build:api
          mkdir -p deploy-api/backend/api/test deploy-api/backend/synthetic-data
          cp -R backend/api/dist backend/api/package.json backend/api/package-lock.json deploy-api/backend/api/
          if [ -d backend/api/test/recordings ]; then cp -R backend/api/test/recordings deploy-api/backend/api/test/; fi
          cp -R backend/synthetic-data/reference deploy-api/backend/synthetic-data/
          npm --prefix deploy-api/backend/api ci --omit=dev --no-audit --no-fund
      - name: Build and package the Next.js app (landing page + dashboard)
        env:
          NEXT_PUBLIC_API_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_API_KEY: ${{ env.API_KEY }}
        run: |
          npm run build
          mkdir deploy-web
          cp -R frontend/.next frontend/public frontend/package.json frontend/package-lock.json frontend/next.config.mjs deploy-web/
          npm --prefix deploy-web ci --omit=dev --no-audit --no-fund
          rm -rf deploy-web/.next/cache
      - name: Give the API its AI, map and Gmail settings (from the demo environment's secrets; empty ones are left as they are)
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          PII_PROVIDER: ${{ secrets.PII_PROVIDER }}
          AZURE_LANGUAGE_ENDPOINT: ${{ secrets.AZURE_LANGUAGE_ENDPOINT }}
          AZURE_LANGUAGE_KEY: ${{ secrets.AZURE_LANGUAGE_KEY }}
          ADDRESS_PROVIDER: ${{ secrets.ADDRESS_PROVIDER }}
          AZURE_MAPS_KEY: ${{ secrets.AZURE_MAPS_KEY }}
          GMAIL_ACCOUNT: ${{ secrets.GMAIL_ACCOUNT || vars.GMAIL_ACCOUNT }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          ALLOW_LIST: ${{ secrets.ALLOW_LIST || vars.ALLOW_LIST }}
          INTAKE_POLL_MINUTES: ${{ secrets.INTAKE_POLL_MINUTES || vars.INTAKE_POLL_MINUTES }}
        run: |
          settings=()
          for k in LLM_PROVIDER AZURE_OPENAI_ENDPOINT AZURE_OPENAI_API_KEY AZURE_OPENAI_DEPLOYMENT PII_PROVIDER \
                   AZURE_LANGUAGE_ENDPOINT AZURE_LANGUAGE_KEY ADDRESS_PROVIDER AZURE_MAPS_KEY \
                   GMAIL_ACCOUNT GMAIL_CLIENT_ID GMAIL_CLIENT_SECRET GMAIL_REFRESH_TOKEN ALLOW_LIST INTAKE_POLL_MINUTES; do
            if [ -n "${!k}" ]; then settings+=("$k=${!k}"); echo "set $k"; else echo "skip $k (no secret)"; fi
          done
          if [ ${#settings[@]} -gt 0 ]; then
            az webapp config appsettings set -g "${{ vars.AZURE_RG }}" -n "${{ vars.NAME }}-api" -o none --settings "${settings[@]}"
          fi
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.NAME }}-api
          package: deploy-api
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.NAME }}-web
          package: deploy-web
      - name: Smoke check
        run: |
          for i in $(seq 1 30); do
            curl -fsS "$API_URL/api/health" | grep -q '"db":"ok"' && curl -fsS -o /dev/null "$WEB_URL/dashboard" && exit 0
            sleep 10
          done
          echo "Smoke check failed"; exit 1
      - name: Close the Postgres firewall again
        if: always()
        run: if [ -n "${FW_RULE:-}" ]; then az resource delete --id "$FW_RULE" --api-version 2024-08-01 || true; fi
