services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: latelens
      POSTGRES_PASSWORD: latelens
      POSTGRES_DB: latelens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
volumes:
  pgdata:
